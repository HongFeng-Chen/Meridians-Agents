name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（vet + test + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go_agent/go.mod
          cache-dependency-path: go_agent/go.sum

      - name: gofmt 检查
        working-directory: go_agent
        run: |
          # 只检查「格式不合规」的文件，不自动改写（避免 CI 偷偷改代码）
          out=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt："
            echo "$out"
            exit 1
          fi

      - name: go vet
        working-directory: go_agent
        run: go vet ./...

      - name: go test
        working-directory: go_agent
        run: go test ./... -count=1

      - name: go build
        working-directory: go_agent
        run: go build ./...

  frontend:
    name: 前端（依赖 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: SDK 契约测试
        working-directory: frontend
        run: npm run test:sdk --if-present
