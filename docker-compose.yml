volumes:
  minio_data:
  milvus_data:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  skill_data:
    driver: local
  # ollama_data:
  #   driver: local  
  etcd_data:
    driver: local

networks:
  app_network:
    driver: bridge
