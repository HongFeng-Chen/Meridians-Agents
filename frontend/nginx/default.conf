# 前端运行时 nginx 配置：静态资源 + /api 反代到 go_agent
#
# 镜像里已把 dist/ 放到 /usr/share/nginx/html，这里负责把同源的 /api 转发到后端。
# 若后端服务名/端口调整，改 proxy_pass 即可。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 文档上传（PDF / Word / Excel）允许较大体积；与后端 maxFileBytes 配合
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 健康检查透传到后端 GET /api/health
    location = /healthz {
        proxy_pass http://go_agent:8000/api/health;
        proxy_read_timeout 5s;
    }

    # 业务 API：/api/health、/api/ingest、/api/query、/api/graph/*、/api/admin/*、
    # /api/upload、/api/extract、/api/prompts/**、/api/memory/**、/api/llm/**、/api/skills/**
    location /api/ {
        proxy_pass http://go_agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        # 上传 / 入库要跑 embedding 与 LLM，后端 http.timeout 已是 300s，这里保持一致
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        # 关闭缓冲，避免长耗时接口被 nginx 提前截断
        proxy_buffering off;
    }

    # 前端为 hash 路由（#/rag-query），无服务端 rewrite 需求；
    # try_files 仅兜底静态资源。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
