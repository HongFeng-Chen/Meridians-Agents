// Package auth.v1 定义身份认证的对外契约。
//
// 只保留 AuthService：用户名密码登录（本地 bcrypt + LDAP/AD）与当前身份查询。
// 登录成功签发与网关同密钥的 HS256 JWT，验签逻辑完全复用现有 Verifier。
//
// 授权不在这个 proto 里：V2 的权限判定只有两层——pkg/authz 的内置角色矩阵
// （代码评审的基线）与 biz/resource 的资源级授权（resource_permissions）。
// 原先的「策略 / 角色绑定」接口随 Casbin 一并移除，见 docs/architecture-v2.md。
syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "go_agent/api/auth/v1;v1";

// —— 登录 ——

// LoginRequest 用户名密码登录。
message LoginRequest {
  // 用户名；LDAP 用户直接用 AD 账号名（sAMAccountName）
  string username = 1 [(google.api.field_behavior) = REQUIRED, json_name = "username"];
  string password = 2 [(google.api.field_behavior) = REQUIRED, json_name = "password"];
  // 目标租户：本地密码登录用（同租户内用户名唯一，跨租户同名是不同的人）；
  // LDAP 登录忽略此字段（统一落 ldap.default_tenant）。留空 = public。
  string tenant = 3 [json_name = "tenant"];
}

// LoginReply 登录结果。
message LoginReply {
  // HS256 JWT，后续请求放 Authorization: Bearer <token>
  string token = 1 [json_name = "token"];
  // 过期时间（RFC3339），前端据此提前刷新/重新登录
  string expires_at = 2 [json_name = "expires_at"];
  // 验证方式：local | ldap
  string auth_source = 3 [json_name = "auth_source"];
}

// MeReply 当前登录身份（从令牌解出 + 名册补充档案）。
message MeReply {
  string user_id = 1 [json_name = "user_id"];
  string tenant_id = 2 [json_name = "tenant_id"];
  repeated string roles = 3 [json_name = "roles"];
  string display_name = 4 [json_name = "display_name"];
  string email = 5 [json_name = "email"];
  // 名册来源：manual | ldap（认证关闭时为空）
  string source = 6 [json_name = "source"];
}

message EmptyReply {}

// AuthService 登录与身份。
service AuthService {
  // Login 用户名密码登录；认证未开启 login 时返回 404。
  // 这是公开端点（白名单直通），失败统一 401 不区分原因。
  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  }
  // Me 当前身份：需要令牌；认证关闭时返回开发态身份。
  rpc Me(EmptyReply) returns (MeReply) {
    option (google.api.http) = {
      get: "/api/auth/me"
    };
  }
}
