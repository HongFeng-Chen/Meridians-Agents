    /v1/todos/create:
        post:
            tags:
                - TodoService
            description: |-
                CreateTodo creates a new todo item and returns the persisted record
                 with the server-assigned id, created_at, and updated_at populated.
                 Returns INVALID_ARGUMENT if the request payload fails validation.
            operationId: TodoService_CreateTodo
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.Todo'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
    /v1/todos/list:
        get:
            tags:
                - TodoService
            description: |-
                ListTodos returns a page of todo items, optionally filtered and ordered.
                 Use the next_page_token from TodoSet to retrieve subsequent pages.
                 Returns INVALID_ARGUMENT if filter, order_by, or page_token are malformed.
            operationId: TodoService_ListTodos
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of todo items to return in a single page.
                     The server may apply a default and a maximum when unset or out of range.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Optional. Token from a previous response's next_page_token used to fetch
                     the next page. Leave empty to request the first page.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. The standard list filter.
                     Supported fields:
                        * `title` (i.e. `title:"bug"`)
                        * `content` (i.e. `content:"docs"`)
                        * `completed` (i.e. `completed` or `NOT completed`)
                        * `created_at` range (i.e. `created_at>="2026-01-01T00:00:00Z"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. A comma-separated list of fields to order by.
                     Supported fields:
                        * `id`
                        * `title`
                        * `created_at`
                        * `updated_at`
                     Append ` desc` to a field for descending order, e.g. `created_at desc`.
                     Defaults to ascending order when no direction is supplied.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoSet'
    /v1/todos/sync:
        post:
            tags:
                - TodoService
            description: |-
                SyncTodos opens a bidirectional stream for two-way synchronization.
                 The client sends SyncTodoRequest messages describing local changes, and
                 the server pushes back TodoEvent messages reflecting the resulting state.
                 The stream stays open until either side closes it.
            operationId: TodoService_SyncTodos
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.SyncTodoRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
    /v1/todos/update:
        put:
            tags:
                - TodoService
            description: |-
                UpdateTodo applies a partial update to an existing todo item using a
                 FieldMask. Only the fields listed in update_mask are overwritten; all
                 other fields are left unchanged.
                 Returns NOT_FOUND if the target todo does not exist, or
                 INVALID_ARGUMENT if update_mask references unknown fields.
            operationId: TodoService_UpdateTodo
            parameters:
                - name: updateMask
                  in: query
                  description: |-
                    Set of field paths in todo to overwrite. Fields not listed are left
                     unchanged. Use a single path of `*` to replace every mutable field.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.Todo'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
    /v1/todos/watch:
        get:
            tags:
                - TodoService
            description: |-
                WatchTodos opens a server-side stream that emits a TodoEvent for every
                 create, update, or delete that matches the supplied filter and ordering.
                 The stream remains open until the client cancels or the server terminates it.
            operationId: TodoService_WatchTodos
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of todo items returned in the initial snapshot
                     before live events begin streaming.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token used to resume from a prior snapshot.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: Optional. List filter expression. Same syntax as ListTodosRequest.filter.
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Optional. Order specification. Same syntax as ListTodosRequest.order_by.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
    /v1/todos/{id}:
        get:
            tags:
                - TodoService
            description: |-
                GetTodo returns a single todo item by its id.
                 Returns NOT_FOUND if no todo exists with the supplied id.
            operationId: TodoService_GetTodo
            parameters:
                - name: id
                  in: path
                  description: Unique identifier of the todo item to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
        delete:
            tags:
                - TodoService
            description: |-
                DeleteTodo soft-deletes a todo item by its id. The record is retained by
                 the server but no longer appears in GetTodo or ListTodos results.
                 Returns NOT_FOUND if no todo exists with the supplied id.
            operationId: TodoService_DeleteTodo
            parameters:
                - name: id
                  in: path
                  description: Unique identifier of the todo item to delete.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
components:
    schemas:
        agentfactory.v1.AgentDef:
            type: object
            properties:
                id:
                    type: string
                agent_key:
                    type: string
                    description: 全局唯一标识（委派能力名 = agent:<agent_key>）
                name:
                    type: string
                description:
                    type: string
                    description: 给 LLM 看的职责描述（语义召回向量化来源）
                system:
                    type: string
                    description: 角色提示词
                llm_model:
                    type: string
                    description: 指定模型（空 = 平台默认数据源）
                graph_type:
                    type: string
                    description: 执行图：react | simple
                capabilities:
                    type: array
                    items:
                        type: string
                    description: 能力白名单：create_agent / agent:<key> / mcp:<unique_name>
                middlewares:
                    type: array
                    items:
                        type: string
                    description: 中间件：audit（恒开启）
                max_turns:
                    type: integer
                    format: int32
                sandbox:
                    type: boolean
                    description: 沙箱灰度：禁止委派其他 Agent
                source:
                    type: string
                    description: 来源：manual | llm
                version:
                    type: integer
                    description: 定义版本（每次更新 +1）
                    format: int32
                enabled:
                    type: boolean
                vectorized:
                    type: boolean
                    description: 向量是否已写入 Milvus
                created_at:
                    type: string
                updated_at:
                    type: string
                role:
                    type: string
                    description: 角色：root | sub | supervisor | risk
                orchestration:
                    type: string
                    description: 成员编排方式：auto | serial | parallel（仅 root 生效）
                members:
                    type: array
                    items:
                        type: string
                    description: 编排成员（agent_key 列表）
                supervisor_key:
                    type: string
                    description: 监察 Agent（role=supervisor 的 agent_key）
                supervision_scope:
                    type: array
                    items:
                        type: string
                    description: 监察范围（仅 supervisor 角色使用，空或 * = 全部成员）
                risk_agent_key:
                    type: string
                    description: 风险评估 Agent（role=risk 的 agent_key，仅 MCP 调用前生效）
                auto_run:
                    type: boolean
                    description: 后台自动运行
                cron_expr:
                    type: string
                    description: 5 段 cron 表达式
                cron_input:
                    type: string
                    description: 定时运行的固定输入
                next_run_at:
                    type: string
                    description: 下次 / 上次自动运行时间
                last_run_at:
                    type: string
                flow:
                    type: string
                    description: 编排画布布局（JSON 字符串：{"positions":{"<agent_key>":{"x":120,"y":112}}}）
                llm_source:
                    type: string
                    description: 默认模型数据源（llm 数据源名，空 = 平台默认）；该源调用失败自动回退 default
                auto_compose:
                    type: boolean
                    description: 自动装配：任务前由 LLM 判定架构与成员，缺成员时自动创建子 Agent（graph_type=auto 时恒生效）
            description: AgentDef Agent 的可配置定义（数据，不是代码）
        agentfactory.v1.AgentDefHit:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/agentfactory.v1.AgentDef'
                score:
                    type: number
                    format: double
                source:
                    type: string
                    description: 命中来源（milvus）
        agentfactory.v1.AgentFactoryStats:
            type: object
            properties:
                agents:
                    type: string
                enabled_agents:
                    type: string
                llm_born:
                    type: string
                    description: LLM 元编程创建的 Agent 数
                sandboxed:
                    type: string
                    description: 沙箱灰度中的 Agent 数
                vectorized:
                    type: string
                tasks:
                    type: string
                pending:
                    type: string
                running:
                    type: string
                succeeded:
                    type: string
                failed:
                    type: string
                canceled:
                    type: string
                capabilities:
                    type: string
                    description: 当前可用能力总数（含 MCP 工具与可委派 Agent）
        agentfactory.v1.AgentInput:
            required:
                - name
            type: object
            properties:
                agent_key:
                    type: string
                name:
                    type: string
                description:
                    type: string
                system:
                    type: string
                llm_model:
                    type: string
                graph_type:
                    type: string
                capabilities:
                    type: array
                    items:
                        type: string
                middlewares:
                    type: array
                    items:
                        type: string
                max_turns:
                    type: integer
                    format: int32
                sandbox:
                    type: boolean
                role:
                    type: string
                    description: 角色：root | sub | supervisor | risk
                orchestration:
                    type: string
                    description: 成员编排方式：auto | serial | parallel
                members:
                    type: array
                    items:
                        type: string
                supervisor_key:
                    type: string
                supervision_scope:
                    type: array
                    items:
                        type: string
                risk_agent_key:
                    type: string
                auto_run:
                    type: boolean
                cron_expr:
                    type: string
                cron_input:
                    type: string
                flow:
                    type: string
                    description: 编排画布布局（JSON 字符串）
                llm_source:
                    type: string
                    description: 默认模型数据源（空 = 平台默认），调用失败回退 default
                auto_compose:
                    type: boolean
                    description: 自动装配：每次任务前由 LLM 判定架构与成员，缺成员时自动创建子 Agent
            description: AgentInput 创建/更新定义的入参
        agentfactory.v1.AgentTask:
            type: object
            properties:
                id:
                    type: string
                agent_def_id:
                    type: string
                agent_key:
                    type: string
                title:
                    type: string
                    description: 输入摘要（列表展示）
                input:
                    type: string
                status:
                    type: string
                    description: pending | running | succeeded | failed | canceled
                progress:
                    type: integer
                    description: 0~100
                    format: int32
                result:
                    type: string
                error_msg:
                    type: string
                parent_task_id:
                    type: string
                    description: 父任务（0 = 根任务）
                depth:
                    type: integer
                    description: 委派深度（根=0）
                    format: int32
                created_at:
                    type: string
                started_at:
                    type: string
                finished_at:
                    type: string
                archived:
                    type: boolean
                    description: 是否已归档到任务历史表（终态任务从任务池迁出）
                conv_id:
                    type: string
                    description: 来源会话（会话编排调用 Agent 时写入；任务链路与会话链路共用）
                user_id:
                    type: string
                    description: 归属用户（隔离键）：任务中心只返回当前用户的任务
            description: AgentTask 异步任务（parent_task_id 形成多 Agent 协作链路树）
        agentfactory.v1.CancelTaskRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
        agentfactory.v1.CapabilitySchema:
            type: object
            properties:
                name:
                    type: string
                    description: create_agent / agent:<key> / mcp:<unique_name>
                type:
                    type: string
                    description: factory | agent | mcp
                description:
                    type: string
                args_example:
                    type: string
                    description: 参数示例（JSON 对象字符串）
                disabled:
                    type: boolean
            description: CapabilitySchema 能力的自描述（白名单选择器 + LLM 提示词共用）
        agentfactory.v1.CreateAgentByLLMReply:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/agentfactory.v1.AgentDef'
                raw_output:
                    type: string
                    description: LLM 生成的原始定义（调试用）
        agentfactory.v1.CreateAgentByLLMRequest:
            required:
                - requirement
            type: object
            properties:
                requirement:
                    type: string
                    description: 需求描述：想造一个干什么、需要哪些能力的 Agent
        agentfactory.v1.DeleteAgentDefReply:
            type: object
            properties:
                id:
                    type: string
        agentfactory.v1.ListAgentDefsReply:
            type: object
            properties:
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/agentfactory.v1.AgentDef'
                total:
                    type: string
        agentfactory.v1.ListCapabilitiesReply:
            type: object
            properties:
                capabilities:
                    type: array
                    items:
                        $ref: '#/components/schemas/agentfactory.v1.CapabilitySchema'
        agentfactory.v1.ListTaskEventsReply:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/agentfactory.v1.TaskEvent'
        agentfactory.v1.ListTasksReply:
            type: object
            properties:
                tasks:
                    type: array
                    items:
                        $ref: '#/components/schemas/agentfactory.v1.AgentTask'
                total:
                    type: string
        agentfactory.v1.RetryTaskRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
        agentfactory.v1.SearchAgentDefsReply:
            type: object
            properties:
                hits:
                    type: array
                    items:
                        $ref: '#/components/schemas/agentfactory.v1.AgentDefHit'
        agentfactory.v1.SubmitTaskRequest:
            required:
                - input
            type: object
            properties:
                agent_def_id:
                    type: string
                    description: 与 agent_key 二选一
                agent_key:
                    type: string
                input:
                    type: string
                    description: 任务输入（自然语言）
        agentfactory.v1.SyncAgentVectorsReply:
            type: object
            properties:
                synced:
                    type: integer
                    format: int32
        agentfactory.v1.SyncAgentVectorsRequest:
            type: object
            properties: {}
        agentfactory.v1.TaskEvent:
            type: object
            properties:
                id:
                    type: string
                task_id:
                    type: string
                turn:
                    type: integer
                    description: 执行轮次（0 = 状态类事件）
                    format: int32
                type:
                    type: string
                    description: status | thought | tool_call | tool_result | delegate | final | error
                payload:
                    type: string
                    description: JSON 字符串
                created_at:
                    type: string
            description: TaskEvent 任务事件（trace 链路检索单元）
        agentfactory.v1.TaskStats:
            type: object
            properties:
                tasks:
                    type: string
                pending:
                    type: string
                running:
                    type: string
                succeeded:
                    type: string
                failed:
                    type: string
                canceled:
                    type: string
        agentfactory.v1.ToggleAgentDefRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                enabled:
                    type: boolean
        agentfactory.v1.UpdateAgentDefRequest:
            required:
                - id
                - input
            type: object
            properties:
                id:
                    type: string
                input:
                    $ref: '#/components/schemas/agentfactory.v1.AgentInput'
        aiplatform.v1.CreatePlatformRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                kind:
                    type: string
                    description: qwen | bailian | generic；省略时按 name 推断（含 qwen / bailian 走对应预设，否则 generic）
                base_url:
                    type: string
                api_key:
                    type: string
                    description: 首次写入必填；更新时留空表示不改
                auth_scheme:
                    type: string
                auth_header:
                    type: string
                headers:
                    type: object
                    additionalProperties:
                        type: string
                catalog_path:
                    type: string
                streamable_path:
                    type: string
                sse_path:
                    type: string
                skill_base_url:
                    type: string
                description:
                    type: string
                enabled:
                    type: boolean
                is_default:
                    type: boolean
        aiplatform.v1.DeletePlatformReply:
            type: object
            properties:
                name:
                    type: string
                deleted:
                    type: boolean
        aiplatform.v1.ImportMCPRequest:
            required:
                - code
            type: object
            properties:
                platform:
                    type: string
                code:
                    type: string
                name:
                    type: string
                    description: 本地服务名，默认 <platform>-<code>
                namespace:
                    type: string
                    description: 命名空间，默认取平台名（工具唯一名即 <namespace>__<tool>）
                transport:
                    type: string
                    description: http（默认）/ sse（本地只支持 http，会自动降级并提示）
                description:
                    type: string
                enabled:
                    type: boolean
                sync_tools:
                    type: boolean
        aiplatform.v1.ImportResult:
            type: object
            properties:
                mcp_server_id:
                    type: string
                server_name:
                    type: string
                namespace:
                    type: string
                endpoint:
                    type: string
                tool_count:
                    type: integer
                    format: int32
                reused:
                    type: boolean
                    description: 本地已有同名服务：复用并重新同步
                message:
                    type: string
                    description: 部分成功/降级提示
            description: ImportResult 接入结果。
        aiplatform.v1.ListPlatformsReply:
            type: object
            properties:
                platforms:
                    type: array
                    items:
                        $ref: '#/components/schemas/aiplatform.v1.Platform'
                total:
                    type: integer
                    format: int32
        aiplatform.v1.Platform:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                    description: 唯一标识（小写），如 qwen
                kind:
                    type: string
                    description: qwen | bailian | generic
                base_url:
                    type: string
                has_key:
                    type: boolean
                    description: 是否已配置 API Key
                auth_scheme:
                    type: string
                    description: bearer | header | none
                auth_header:
                    type: string
                    description: auth_scheme=header 时的头名
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: 额外请求头（除鉴权头）
                catalog_path:
                    type: string
                    description: MCP 目录接口路径；为空表示平台不提供目录
                streamable_path:
                    type: string
                    description: 接入地址模板，{code} 会替换为 mcpCode
                sse_path:
                    type: string
                skill_base_url:
                    type: string
                    description: 非空时保存平台会幂等登记同名技能市场
                skill_hub:
                    type: string
                    description: 已登记的技能市场名
                description:
                    type: string
                enabled:
                    type: boolean
                is_default:
                    type: boolean
                created_at:
                    type: string
                updated_at:
                    type: string
            description: Platform 外部 AI 平台。
        aiplatform.v1.PlatformReply:
            type: object
            properties:
                platform:
                    $ref: '#/components/schemas/aiplatform.v1.Platform'
                warning:
                    type: string
                    description: 非空表示平台已保存但技能市场登记失败（不阻断）
            description: PlatformReply 平台操作结果。
        aiplatform.v1.RemoteMCP:
            type: object
            properties:
                code:
                    type: string
                    description: mcpCode，接入地址模板里的 {code}
                name:
                    type: string
                description:
                    type: string
                provider:
                    type: string
                    description: 所属平台
                transport:
                    type: string
                    description: 建议传输：http | sse（导入统一走 http）
                endpoint:
                    type: string
                    description: 解析后的接入地址
                tool_count:
                    type: integer
                    format: int32
                tags:
                    type: array
                    items:
                        type: string
                installed:
                    type: boolean
                    description: 本地是否已接入
                server_name:
                    type: string
                    description: 接入后的本地服务名
            description: RemoteMCP 平台目录里的 MCP 服务。
        aiplatform.v1.SearchMCPReply:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/aiplatform.v1.RemoteMCP'
                total:
                    type: integer
                    format: int32
                hint:
                    type: string
                    description: 目录不可用时的替代提示
        aiplatform.v1.TestResult:
            type: object
            properties:
                ok:
                    type: boolean
                    description: 能不能用这个平台拉服务（目录可用，或接入模板可用）
                message:
                    type: string
                latency_ms:
                    type: string
                catalog_ok:
                    type: boolean
                sample_count:
                    type: integer
                    format: int32
                auth_configured:
                    type: boolean
            description: TestResult 平台连通性测试结果。
        aiplatform.v1.UpdatePlatformRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                kind:
                    type: string
                base_url:
                    type: string
                api_key:
                    type: string
                    description: 留空表示不改（避免前端回显脱敏值时把 key 清掉）
                auth_scheme:
                    type: string
                auth_header:
                    type: string
                headers:
                    type: object
                    additionalProperties:
                        type: string
                catalog_path:
                    type: string
                streamable_path:
                    type: string
                sse_path:
                    type: string
                skill_base_url:
                    type: string
                description:
                    type: string
                enabled:
                    type: boolean
                is_default:
                    type: boolean
        conversation.v1.AddDebateRoleReply:
            type: object
            properties:
                debate:
                    $ref: '#/components/schemas/conversation.v1.Debate'
        conversation.v1.AddDebateRoleRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 会话 ID（即路径 {id}）
                role:
                    $ref: '#/components/schemas/conversation.v1.DebateRole'
        conversation.v1.AppendMessageReply:
            type: object
            properties:
                message:
                    $ref: '#/components/schemas/conversation.v1.ConversationMessage'
        conversation.v1.AppendMessageRequest:
            required:
                - id
                - role
            type: object
            properties:
                id:
                    type: string
                    description: 会话 ID（即路径 {id}）
                role:
                    type: string
                    description: user / assistant
                content:
                    type: string
                meta:
                    type: string
                    description: 能力调用链路 JSON（可空）
                task_id:
                    type: string
                    description: 关联任务 ID（0 = 无）
        conversation.v1.Attachment:
            type: object
            properties:
                name:
                    type: string
                    description: 展示名（原文件名）
                url:
                    type: string
                    description: 访问地址（/api/files/... 相对路径）
                mime:
                    type: string
                    description: MIME 类型，如 image/png、video/mp4
                size:
                    type: string
                    description: 字节数
            description: Attachment 聊天附件（图片 / 视频等媒体文件）。
        conversation.v1.ChatReply:
            type: object
            properties:
                user_message:
                    $ref: '#/components/schemas/conversation.v1.ConversationMessage'
                assistant_message:
                    $ref: '#/components/schemas/conversation.v1.ConversationMessage'
        conversation.v1.ChatRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 会话 ID（即路径 {id}）
                content:
                    type: string
                    description: 用户本轮输入
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/conversation.v1.Attachment'
                    description: 本轮附件（先经 UploadMedia 上传，再传返回的 attachment 列表）
        conversation.v1.Conversation:
            type: object
            properties:
                id:
                    type: string
                    description: 会话 ID：agent 驱动的会话 = 首轮任务 ID；其他 = 自动生成
                title:
                    type: string
                agent_key:
                    type: string
                    description: 默认会话 Agent（可空 = 纯检索 / 工具会话）
                message_count:
                    type: string
                last_message:
                    type: string
                    description: 最新一条消息预览（截断），列表展示用
                created_at:
                    type: string
                updated_at:
                    type: string
                has_debate:
                    type: boolean
                    description: 该会话是否发生过辩论（目录「辩论历史」分组过滤用）
                user_id:
                    type: string
                    description: 归属用户（隔离键）：列表与详情接口只返回当前用户的会话
            description: Conversation 会话目录条目。
        conversation.v1.ConversationMessage:
            type: object
            properties:
                id:
                    type: string
                conversation_id:
                    type: string
                role:
                    type: string
                    description: user / assistant
                content:
                    type: string
                meta:
                    type: string
                    description: 能力调用链路 JSON：{op:"agent", task_id} / {op:"rag", kind, hits} / {op:"mcp", tool, ok} …
                task_id:
                    type: string
                    description: 关联任务 ID（0 = 无）
                created_at:
                    type: string
                speaker:
                    type: string
                    description: 发言者：普通会话为空；辩论为角色名 / 主持人
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/conversation.v1.Attachment'
                    description: 本条消息携带的附件（图片 / 视频等）
            description: ConversationMessage 会话内一条消息。
        conversation.v1.CreateConversationReply:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/conversation.v1.Conversation'
        conversation.v1.CreateConversationRequest:
            type: object
            properties:
                id:
                    type: string
                    description: 可选：会话 ID（传任务 ID 即「会话 id = task id」）；空 = 自动生成
                title:
                    type: string
                agent_key:
                    type: string
        conversation.v1.CreateDebateReply:
            type: object
            properties:
                debate:
                    $ref: '#/components/schemas/conversation.v1.Debate'
        conversation.v1.CreateDebateRequest:
            required:
                - id
                - topic
            type: object
            properties:
                id:
                    type: string
                    description: 会话 ID（即路径 {id}）
                topic:
                    type: string
                roles:
                    type: array
                    items:
                        $ref: '#/components/schemas/conversation.v1.DebateRole'
                max_rounds:
                    type: integer
                    format: int32
                end_rule:
                    type: string
                    description: rounds / consensus
        conversation.v1.Debate:
            type: object
            properties:
                id:
                    type: string
                conversation_id:
                    type: string
                topic:
                    type: string
                status:
                    type: string
                    description: running / stopping / finished / stopped
                round:
                    type: integer
                    format: int32
                max_rounds:
                    type: integer
                    format: int32
                end_rule:
                    type: string
                    description: rounds / consensus
                roles:
                    type: array
