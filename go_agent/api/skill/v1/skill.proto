// Package skill.v1 定义技能管理域的对外契约。
//
// 对应 internal/biz/skill：技能以 name 为稳定标识（重复安装=升级），支持
// 多文件包、在线启停、落盘同步，以及从技能市场（skillhub）搜索与下载安装。
// token 只进不出：读取接口仅返回 has_token。
syntax = "proto3";

package skill.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "go_agent/api/skill/v1;v1";

// File 技能附带文件。
message File {
  // 相对技能目录的路径，如 SKILL.md、scripts/run.py
  string path = 1 [json_name = "path"];
  string content = 2 [json_name = "content"];
  int32 size = 3 [json_name = "size"];
}

// SkillExecutionSpec 技能执行配置（V2 运行时）。
//
// 决定这个技能是「指令包」还是「远程能力」：local 把 SKILL.md 注入上下文，
// remote 同步调度到 Worker，async 入队后由派发协程执行。
message SkillExecutionSpec {
  // local | remote | async，缺省 local
  string mode = 1 [json_name = "mode"];
  // 远程协议，目前支持 http
  string protocol = 2 [json_name = "protocol"];
  // 直连地址（单实例部署）；有 Worker 注册实例时优先用实例
  string endpoint = 3 [json_name = "endpoint"];
  // 参数 JSON Schema 原文（进 Agent 能力描述，供 LLM 生成参数）
  string input_schema = 4 [json_name = "input_schema"];
  string output_schema = 5 [json_name = "output_schema"];
  // 单次调用超时（秒），0 取默认值（remote 60 / async 300）
  int32 timeout_sec = 6 [json_name = "timeout_sec"];
  // 失败重试次数（换实例重试）
  int32 retry = 7 [json_name = "retry"];
  // 单实例并发上限
  int32 concurrency = 8 [json_name = "concurrency"];
  // 是否按幂等键去重（同键成功结果回放）
  bool idempotent = 9 [json_name = "idempotent"];
  repeated string required_scopes = 10 [json_name = "required_scopes"];
  // Worker 侧实现名，缺省等于技能名（改技能名不必改 Worker 代码）
  string handler = 11 [json_name = "handler"];
}

// Skill 技能。
message Skill {
  string name = 1 [json_name = "name"];
  string version = 2 [json_name = "version"];
  string title = 3 [json_name = "title"];
  string description = 4 [json_name = "description"];
  string category = 5 [json_name = "category"];
  repeated string tags = 6 [json_name = "tags"];
  // hub | upload | builtin | url
  string source = 7 [json_name = "source"];
  string source_url = 8 [json_name = "source_url"];
  bool enabled = 9 [json_name = "enabled"];
  string checksum = 10 [json_name = "checksum"];
  // SKILL.md 正文（列表接口不返回）
  string content = 11 [json_name = "content"];
  // 文件正文（列表接口不返回，单文件接口返回单条）
  repeated File files = 12 [json_name = "files"];
  int32 file_count = 13 [json_name = "file_count"];
  int32 size = 14 [json_name = "size"];
  string installed_at = 15 [json_name = "installed_at"];
  string updated_at = 16 [json_name = "updated_at"];
  // 执行配置（V2 运行时）
  SkillExecutionSpec execution = 17 [json_name = "execution"];
}

// SkillInstance Skill Worker 实例。
message SkillInstance {
  string id = 1 [json_name = "id"];
  string skill_name = 2 [json_name = "skill_name"];
  string endpoint = 3 [json_name = "endpoint"];
  string version = 4 [json_name = "version"];
  string region = 5 [json_name = "region"];
  repeated string labels = 6 [json_name = "labels"];
  int32 weight = 7 [json_name = "weight"];
  int32 max_concurrency = 8 [json_name = "max_concurrency"];
  int32 inflight = 9 [json_name = "inflight"];
  // online | draining | offline
  string status = 10 [json_name = "status"];
  string last_heartbeat = 11 [json_name = "last_heartbeat"];
  int64 latency_ms = 12 [json_name = "latency_ms"];
  // 连续失败次数（达到阈值熔断）
  int32 failures = 13 [json_name = "failures"];
  int64 successes = 14 [json_name = "successes"];
  string last_error = 15 [json_name = "last_error"];
}

// SkillExecution 一次技能执行记录。
message SkillExecution {
  string id = 1 [json_name = "id"];
  string task_id = 2 [json_name = "task_id"];
  string skill_name = 3 [json_name = "skill_name"];
  string skill_version = 4 [json_name = "skill_version"];
  // local | remote | async
  string mode = 5 [json_name = "mode"];
  // queued | running | succeeded | failed | timeout | canceled
  string status = 6 [json_name = "status"];
  string tenant_id = 7 [json_name = "tenant_id"];
  string user_id = 8 [json_name = "user_id"];
  string agent_key = 9 [json_name = "agent_key"];
  string session_id = 10 [json_name = "session_id"];
  string idempotency_key = 11 [json_name = "idempotency_key"];
  // 输入 / 输出 JSON 原文
  string input = 12 [json_name = "input"];
  string output = 13 [json_name = "output"];
  string error = 14 [json_name = "error"];
  string worker_id = 15 [json_name = "worker_id"];
  int32 attempts = 16 [json_name = "attempts"];
  int64 latency_ms = 17 [json_name = "latency_ms"];
  string trace_id = 18 [json_name = "trace_id"];
  string queued_at = 19 [json_name = "queued_at"];
  string started_at = 20 [json_name = "started_at"];
  string finished_at = 21 [json_name = "finished_at"];
  string created_at = 22 [json_name = "created_at"];
}

// Hub 技能市场数据源。
message Hub {
  string name = 1 [json_name = "name"];
  string base_url = 2 [json_name = "base_url"];
  // 是否已配置访问令牌
  bool has_token = 3 [json_name = "has_token"];
  bool enabled = 4 [json_name = "enabled"];
  bool is_default = 5 [json_name = "is_default"];
  string description = 6 [json_name = "description"];
  string created_at = 7 [json_name = "created_at"];
  string updated_at = 8 [json_name = "updated_at"];
}

// HubSkill 市场里的技能条目（搜索结果）。
message HubSkill {
  string name = 1 [json_name = "name"];
  string version = 2 [json_name = "version"];
  string title = 3 [json_name = "title"];
  string description = 4 [json_name = "description"];
  string category = 5 [json_name = "category"];
  repeated string tags = 6 [json_name = "tags"];
  int32 downloads = 7 [json_name = "downloads"];
  // 本地是否已安装
  bool installed = 8 [json_name = "installed"];
  // 来源市场名
  string hub = 9 [json_name = "hub"];
}

// SyncResult 落盘结果。
message SyncResult {
  string dir = 1 [json_name = "dir"];
  repeated string synced = 2 [json_name = "synced"];
  repeated string removed = 3 [json_name = "removed"];
}

// SkillStats 规模统计。
message SkillStats {
  int64 skills = 1 [json_name = "skills"];
  int64 enabled = 2 [json_name = "enabled"];
  int64 hubs = 3 [json_name = "hubs"];
}

// SkillFiles 技能文件清单（只含路径与大小）。
message SkillFiles {
  string name = 1 [json_name = "name"];
  int32 file_count = 2 [json_name = "file_count"];
  int32 size = 3 [json_name = "size"];
  repeated File files = 4 [json_name = "files"];
}

message ListSkillsRequest {
  // 关键字（name / title / description）
  string q = 1 [json_name = "q"];
  string category = 2 [json_name = "category"];
  // hub | upload | builtin
  string source = 3 [json_name = "source"];
  // "1"/"true" 只看启用，"0"/"false" 只看停用，空为全部
  string enabled = 4 [json_name = "enabled"];
  int32 limit = 5 [json_name = "limit"];
}

message ListSkillsReply {
  repeated Skill skills = 1 [json_name = "skills"];
  int32 total = 2 [json_name = "total"];
}

message GetSkillRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
}

message InstallSkillRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  string version = 2 [json_name = "version"];
  string title = 3 [json_name = "title"];
  string description = 4 [json_name = "description"];
  string category = 5 [json_name = "category"];
  repeated string tags = 6 [json_name = "tags"];
  // SKILL.md 内容
  string content = 7 [json_name = "content"];
  // 附加文件，与 content 至少提供一项
  repeated File files = 8 [json_name = "files"];
  // 缺省 true
  optional bool enabled = 9 [json_name = "enabled"];
  // 执行配置：缺省 local（只注入 SKILL.md）
  SkillExecutionSpec execution = 10 [json_name = "execution"];
}

message UninstallSkillRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
}

message UninstallSkillReply {
  bool deleted = 1 [json_name = "deleted"];
}

message ToggleSkillRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
}

// UseSkillRequest 技能使用：返回技能内容并落一条使用历史（op_histories）。
message UseSkillRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  // 用途说明，记入历史（如 console 预览、runtime 加载）
  string purpose = 2 [json_name = "purpose"];
}

message ListSkillFilesRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
}

message ReadSkillFileRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  string path = 2 [(google.api.field_behavior) = REQUIRED, json_name = "path"];
}

message SyncSkillsRequest {}

// —— V2 运行时：执行 / 实例 / 执行记录 ——

// ExecuteSkillRequest 执行技能（统一入口：local 返回 SKILL.md，remote 等结果，async 返回执行 ID）。
message ExecuteSkillRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  // 参数 JSON 对象字符串（按技能的 input_schema 生成）
  string input = 2 [json_name = "input"];
  // 关联任务（任务内调用时用于链路聚合）
  string task_id = 3 [json_name = "task_id"];
  // 用途说明（local 模式注入上下文）
  string purpose = 4 [json_name = "purpose"];
  // 幂等键：同一键的重复调用回放上次成功结果
  string idempotency_key = 5 [json_name = "idempotency_key"];
  // 强制异步（仅对 remote 技能有意义）
  bool async = 6 [json_name = "async"];
  // 覆盖技能配置的超时（秒）
  int32 timeout_sec = 7 [json_name = "timeout_sec"];
}

// ExecuteSkillReply 执行结果。
message ExecuteSkillReply {
  string execution_id = 1 [json_name = "execution_id"];
  string skill_name = 2 [json_name = "skill_name"];
  string mode = 3 [json_name = "mode"];
  string status = 4 [json_name = "status"];
  // 输出 JSON 原文
  string output = 5 [json_name = "output"];
  // 供 LLM 消费的文本视图
  string text = 6 [json_name = "text"];
  string worker_id = 7 [json_name = "worker_id"];
  int32 attempts = 8 [json_name = "attempts"];
  int64 latency_ms = 9 [json_name = "latency_ms"];
  // 命中幂等键，回放的是上次结果
  bool replayed = 10 [json_name = "replayed"];
  // 异步模式：已入队
  bool queued = 11 [json_name = "queued"];
}

message ListSkillExecutionsRequest {
  string skill = 1 [json_name = "skill"];
  string status = 2 [json_name = "status"];
  string task_id = 3 [json_name = "task_id"];
  int32 limit = 4 [json_name = "limit"];
}

message ListSkillExecutionsReply {
  repeated SkillExecution executions = 1 [json_name = "executions"];
  int32 total = 2 [json_name = "total"];
}

message GetSkillExecutionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED, json_name = "id"];
}

message CancelSkillExecutionRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED, json_name = "id"];
}

message SetSkillExecutionRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  SkillExecutionSpec execution = 2 [json_name = "execution"];
}

message ListSkillInstancesRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
}

message ListSkillInstancesReply {
  repeated SkillInstance instances = 1 [json_name = "instances"];
  int32 total = 2 [json_name = "total"];
}

// RegisterSkillInstanceRequest Worker 自注册（同 id 重复注册 = 更新）。
message RegisterSkillInstanceRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  // Worker 自报的唯一标识，缺省用 endpoint
  string id = 2 [json_name = "id"];
  string endpoint = 3 [(google.api.field_behavior) = REQUIRED, json_name = "endpoint"];
  string version = 4 [json_name = "version"];
  string region = 5 [json_name = "region"];
  repeated string labels = 6 [json_name = "labels"];
  int32 weight = 7 [json_name = "weight"];
  int32 max_concurrency = 8 [json_name = "max_concurrency"];
}

message HeartbeatSkillInstanceRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  string id = 2 [(google.api.field_behavior) = REQUIRED, json_name = "id"];
  int32 inflight = 3 [json_name = "inflight"];
  int64 latency_ms = 4 [json_name = "latency_ms"];
  // online | draining
  string status = 5 [json_name = "status"];
}

message HeartbeatSkillInstanceReply {
  bool ok = 1 [json_name = "ok"];
}

message DeleteSkillInstanceRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  string id = 2 [(google.api.field_behavior) = REQUIRED, json_name = "id"];
}

message DeleteSkillInstanceReply {
  bool deleted = 1 [json_name = "deleted"];
}

message SearchHubSkillsRequest {
  string q = 1 [json_name = "q"];
  // 指定市场名，留空用默认市场
  string hub = 2 [json_name = "hub"];
  int32 limit = 3 [json_name = "limit"];
}

message SearchHubSkillsReply {
  repeated HubSkill skills = 1 [json_name = "skills"];
  int32 total = 2 [json_name = "total"];
}

// ImportSkillFromURLRequest 从技能包 URL 安装。
//
// 用于没有市场 API、只给下载链接的分发方式（千问技能包 / 内部归档）：
// zip 按包内结构入库；单文件按 SKILL.md 正文处理（此时 name 必填）；JSON 包按字段解析。
message ImportSkillFromURLRequest {
  // 技能包地址，只支持 http/https
  string url = 1 [(google.api.field_behavior) = REQUIRED, json_name = "url"];
  // 包内没有技能名时必填
  string name = 2 [json_name = "name"];
  string version = 3 [json_name = "version"];
  // 私有链接的访问令牌（Authorization: Bearer）
  string token = 4 [json_name = "token"];
  optional bool enable = 5 [json_name = "enable"];
}

message InstallFromHubRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  // 留空安装最新版
  string version = 2 [json_name = "version"];
  string hub = 3 [json_name = "hub"];
  // 缺省 true
  optional bool enable = 4 [json_name = "enable"];
}

message ListHubsRequest {}

message ListHubsReply {
  repeated Hub hubs = 1 [json_name = "hubs"];
  int32 total = 2 [json_name = "total"];
}

message CreateHubRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  string base_url = 2 [(google.api.field_behavior) = REQUIRED, json_name = "base_url"];
  string token = 3 [json_name = "token"];
  optional bool enabled = 4 [json_name = "enabled"];
  bool is_default = 5 [json_name = "is_default"];
  string description = 6 [json_name = "description"];
}

message UpdateHubRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
  optional string base_url = 2 [json_name = "base_url"];
  optional string token = 3 [json_name = "token"];
  optional bool enabled = 4 [json_name = "enabled"];
  optional bool is_default = 5 [json_name = "is_default"];
  optional string description = 6 [json_name = "description"];
}

message DeleteHubRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
}

message DeleteHubReply {
  bool deleted = 1 [json_name = "deleted"];
}

message SetDefaultHubRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, json_name = "name"];
}

message GetSkillStatsRequest {}

// SkillService 技能与技能市场管理。
//
// 注意：gorilla/mux 按注册顺序匹配，/skills/stats、/skills/from-hub、/skills/hubs
// 必须排在 /skills/{name} 之前，因此静态路径的 RPC 先声明。
service SkillService {
  // ListSkills 技能列表。
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsReply) {
    option (google.api.http) = {
      get: "/api/skills"
    };
  }

  // GetSkillStats 规模统计。
  rpc GetSkillStats(GetSkillStatsRequest) returns (SkillStats) {
    option (google.api.http) = {
      get: "/api/skills/stats"
    };
  }

  // SearchHubSkills 搜索技能市场。
  rpc SearchHubSkills(SearchHubSkillsRequest) returns (SearchHubSkillsReply) {
    option (google.api.http) = {
      get: "/api/skills/from-hub"
    };
  }

  // ListHubs 技能市场列表。
  rpc ListHubs(ListHubsRequest) returns (ListHubsReply) {
    option (google.api.http) = {
      get: "/api/skills/hubs"
    };
  }

  // SearchSkillhub 搜索技能市场（与 SearchHubSkills 等价的语义入口）。
  rpc SearchSkillhub(SearchHubSkillsRequest) returns (SearchHubSkillsReply) {
    option (google.api.http) = {
      get: "/api/skillhub/search"
    };
  }

  // ListSkillhubHubs 技能市场列表（语义入口）。
  rpc ListSkillhubHubs(ListHubsRequest) returns (ListHubsReply) {
    option (google.api.http) = {
      get: "/api/skillhub/hubs"
    };
  }

  // ImportSkillFromURL 从技能包 URL 安装（zip / SKILL.md / JSON 包）。
  rpc ImportSkillFromURL(ImportSkillFromURLRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/skills/import-url"
      body: "*"
    };
  }

  // ListSkillExecutions 执行记录列表（账本；异步任务也在这里查）。
  rpc ListSkillExecutions(ListSkillExecutionsRequest) returns (ListSkillExecutionsReply) {
    option (google.api.http) = {
      get: "/api/skills/executions"
    };
  }

  // GetSkillExecution 单条执行记录（异步结果轮询）。
  rpc GetSkillExecution(GetSkillExecutionRequest) returns (SkillExecution) {
    option (google.api.http) = {
      get: "/api/skills/executions/{id}"
    };
  }

  // GetSkill 技能详情（含 SKILL.md 与文件正文）。
  rpc GetSkill(GetSkillRequest) returns (Skill) {
    option (google.api.http) = {
      get: "/api/skills/{name}"
    };
  }

  // ExecuteSkill 执行技能：local 返回 SKILL.md，remote 同步等结果，async 返回执行 ID。
  rpc ExecuteSkill(ExecuteSkillRequest) returns (ExecuteSkillReply) {
    option (google.api.http) = {
      post: "/api/skills/{name}/execute"
      body: "*"
    };
  }

  // SetSkillExecution 修改执行配置（切换 local/remote/async、调超时与重试）。
  rpc SetSkillExecution(SetSkillExecutionRequest) returns (Skill) {
    option (google.api.http) = {
      put: "/api/skills/{name}/execution"
      body: "*"
    };
  }

  // CancelSkillExecution 取消排队中的执行。
  rpc CancelSkillExecution(CancelSkillExecutionRequest) returns (SkillExecution) {
    option (google.api.http) = {
      post: "/api/skills/executions/{id}/cancel"
    };
  }

  // ListSkillInstances 技能 Worker 实例列表（含在线状态与熔断计数）。
  rpc ListSkillInstances(ListSkillInstancesRequest) returns (ListSkillInstancesReply) {
    option (google.api.http) = {
      get: "/api/skills/{name}/instances"
    };
  }

  // RegisterSkillInstance Worker 自注册（同 id 重复注册 = 更新地址与容量）。
  rpc RegisterSkillInstance(RegisterSkillInstanceRequest) returns (SkillInstance) {
    option (google.api.http) = {
      post: "/api/skills/{name}/instances"
      body: "*"
    };
  }

  // HeartbeatSkillInstance 实例心跳（在途数 / 状态）。
  rpc HeartbeatSkillInstance(HeartbeatSkillInstanceRequest) returns (HeartbeatSkillInstanceReply) {
    option (google.api.http) = {
      post: "/api/skills/{name}/instances/{id}/heartbeat"
      body: "*"
    };
  }

  // DeleteSkillInstance 摘除实例（Worker 下线）。
  rpc DeleteSkillInstance(DeleteSkillInstanceRequest) returns (DeleteSkillInstanceReply) {
    option (google.api.http) = {
      delete: "/api/skills/{name}/instances/{id}"
    };
  }
  // InstallSkill 手动安装/上传技能（同名视为升级）。
  rpc InstallSkill(InstallSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/skills"
      body: "*"
    };
  }

  // UninstallSkill 卸载技能。
  rpc UninstallSkill(UninstallSkillRequest) returns (UninstallSkillReply) {
    option (google.api.http) = {
      delete: "/api/skills/{name}"
    };
  }

  // EnableSkill 启用技能。
  rpc EnableSkill(ToggleSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/skills/{name}/enable"
    };
  }

  // DisableSkill 停用技能。
  rpc DisableSkill(ToggleSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/skills/{name}/disable"
    };
  }

  // UseSkill 使用技能：返回技能内容，同时落一条技能使用历史（task 内调用自动关联任务）。
  rpc UseSkill(UseSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/skills/{name}/use"
      body: "*"
    };
  }

  // ListSkillFiles 技能文件清单（只返回路径与大小）。
  rpc ListSkillFiles(ListSkillFilesRequest) returns (SkillFiles) {
    option (google.api.http) = {
      get: "/api/skills/{name}/files"
    };
  }

  // ReadSkillFile 读取单个文件正文。
  rpc ReadSkillFile(ReadSkillFileRequest) returns (File) {
    option (google.api.http) = {
      get: "/api/skills/{name}/file"
    };
  }

  // SyncSkills 把启用技能落盘到 sync_dir。
  rpc SyncSkills(SyncSkillsRequest) returns (SyncResult) {
    option (google.api.http) = {
      post: "/api/skills/sync"
    };
  }

  // InstallFromHub 从技能市场安装。
  rpc InstallFromHub(InstallFromHubRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/skills/from-hub"
      body: "*"
    };
  }

  // CreateHub 新增技能市场。
  rpc CreateHub(CreateHubRequest) returns (Hub) {
    option (google.api.http) = {
      post: "/api/skills/hubs"
      body: "*"
    };
  }

  // UpdateHub 修改技能市场。
  rpc UpdateHub(UpdateHubRequest) returns (Hub) {
    option (google.api.http) = {
      patch: "/api/skills/hubs/{name}"
      body: "*"
    };
  }

  // DeleteHub 删除技能市场。
  rpc DeleteHub(DeleteHubRequest) returns (DeleteHubReply) {
    option (google.api.http) = {
      delete: "/api/skills/hubs/{name}"
    };
  }

  // SetDefaultHub 设为默认市场。
  rpc SetDefaultHub(SetDefaultHubRequest) returns (Hub) {
    option (google.api.http) = {
      post: "/api/skills/hubs/{name}/default"
    };
  }
}
