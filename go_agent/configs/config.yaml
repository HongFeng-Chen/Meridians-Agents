server:
  http:
    addr: 0.0.0.0:8000
    # Kratos 默认每请求 1s 超时；入库要跑 embedding + LLM，图谱抽取更慢，放到 5min
    timeout: 300s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 300s

# 网关安全边界：认证 / 限流 / 预算。三项都可独立开关。
# 默认全关是为了本地开发开箱即跑——一旦要对外暴露端口，至少把 auth 打开：
#   AUTH_ENABLED=true AUTH_JWT_SECRET=<32字节随机串> ./go_agent -conf configs
#
# ⚠ 管理面（MCP 服务配置、工具启停、连接管理等）另有硬性规则，与 auth 开关无关：
#   - 只有携带 role=admin 的 JWT / 静态令牌（user:tenant:admin）才算管理员；
#   - 认证关闭时仅放行「本机回环地址」的管理操作，远程请求一律 403。
#   这样即便 AUTH_ENABLED=false 且监听 0.0.0.0，公网也无法创建 stdio MCP 服务。
security:
  auth:
    enabled: ${AUTH_ENABLED:false}
    # HS256 密钥；为空则 JWT 一律拒绝（只能走 staticTokens）
    jwtSecret: ${AUTH_JWT_SECRET:}
    header: Authorization
    # 从 JWT payload 取用户 / 租户的 claim 名
    userClaim: sub
    tenantClaim: tenant_id
    # 关闭认证时使用的开发态身份（保留 "default" 以兼容历史数据）
    devUser: ${AUTH_DEV_USER:default}
    devTenant: ${AUTH_DEV_TENANT:public}
    # 白名单：探活、指标、聊天附件、平台内置 MCP 不需要令牌
    publicPaths:
      - /api/health
      - /healthz
      - /metrics
      - /api/files/
      - /mcp/platform
    # 静态令牌 → "user:tenant"，适合巡检脚本与内网调用
    staticTokens: {}
  rateLimit:
    enabled: ${RATELIMIT_ENABLED:false}
    # 每个「租户 × 路由」的令牌桶
    qps: 20
    burst: 40
    # 写接口配额更紧（一次 POST 可能触发一次完整的 Agent 执行）
    writeQps: 5
    writeBurst: 10
    # 单请求最长执行时间（向下游传递 deadline；0 = 用 server.http.timeout）
    timeout: 300s
  budget:
    # 单任务（含派生子任务）的 token 上限与 LLM 调用次数上限，0 = 不限。
    # 超限时执行图走「预算耗尽」收敛分支，产出已有中间结论而不是硬失败。
    maxTokens: ${BUDGET_MAX_TOKENS:400000}
    maxCalls: ${BUDGET_MAX_CALLS:80}
    # 并行波次上限：一个宽 DAG 不会同时拉起几十个 Agent 烧钱
    maxParallel: ${BUDGET_MAX_PARALLEL:4}
    # 计价（元 / 百万 token），用于 /metrics 的成本估算；按实际采购价改
    inputPricePerM: ${PRICE_INPUT_PER_M:1}
    outputPricePerM: ${PRICE_OUTPUT_PER_M:2}

data:
  database:
    driver: mysql
    source: ${DATABASE_SOURCE:root:root@tcp(127.0.0.1:3306)/go_agent?timeout=5s&parseTime=True&loc=Local&charset=utf8mb4}
    # Development conveniences. 生产环境用环境变量关掉：
    #   DB_DEBUG=false DB_AUTO_MIGRATE=false ./go_agent -conf configs
    # auto_migrate 关闭后，表结构变更要在发布前单独执行（见 DEPLOY 的迁移章节）
    debug: ${DB_DEBUG:true}
    auto_migrate: ${DB_AUTO_MIGRATE:true}
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    # 默认值与 docker-compose.yml 里的 --requirepass 保持一致，本地开箱可跑；
    # 要连无密码 Redis，直接把这里改成空串或设置 REDIS_PASSWORD 环境变量。
    # （k8s 里由 Secret 注入 REDIS_PASSWORD）
    password: ${REDIS_PASSWORD:redis_pass}
    db: 0
    read_timeout: 1s
    write_timeout: 1s
    dial_timeout: 3s
  embedding:
    # 默认本地 Ollama（bge-m3，1024 维）；本地地址不需要真实 key，占位即可
    baseURL: ${EMBED_BASE_URL:http://localhost:11434/v1}
    apiKey: ${EMBED_API_KEY:ollama}
    model: ${EMBED_MODEL:bge-m3}
    dimension: 1024
    httpTimeout: 60s
  # LLM 生成模型（OpenAI 兼容接口：DeepSeek / OpenAI / Ollama / SiliconFlow）
  # 这里只作兜底默认值：运行时以 MySQL llm_providers 表为准，表为空时用本块播种 default 数据源。
  # 密钥不落明文——apiKey 默认留空，必须通过 LLM_API_KEY 环境变量注入，
  # 或直接在控制台「LLM」页登记数据源（落库后以数据库为准）。
  llm:
    baseURL: ${LLM_BASE_URL:https://api.deepseek.com}
    apiKey: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-flash}
    temperature: 0.3
    httpTimeout: 120s
    # 多数据源配置（MySQL llm_providers）的内存缓存时长；
    # 管理接口变更会立即刷新本实例，这里只兜住多实例最终一致
    reloadTTL: 30s
  milvus:
    uri: ${MILVUS_URI:http://127.0.0.1:19530}
    token: ${MILVUS_TOKEN:root:Milvus}
    collection: ${MILVUS_COLLECTION:rag_docs}
    timeout: 10s
    loadTimeout: 120s
  rag:
    topK: 5
    topN: 3
    maxChunk: 600
    overlap: 100
    cacheTTL: 300s
    graphTopK: 4
    graphHops: 2
    graphMaxEdges: 200
    graphMaxEntities: 10
    graphMaxRelations: 8
    embedBatch: 32
  # 召回精排（可选）：混合检索 topK 条后用交叉编码器重排，更准且喂回更短。
  # provider=cohere 时走 POST {baseURL}/rerank（Jina / SiliconFlow / Cohere 兼容）；
  # provider=dashscope 时走百炼原生 rerank（model 如 gte-rerank-v2）。
  # 未启用或调用失败自动按检索原序返回，不影响主链路。
  rerank:
    enabled: false
    provider: dashscope
    baseURL: https://dashscope.aliyuncs.com
    apiKey: ""
    model: gte-rerank-v2
    topN: 0 # 0 = 沿用 rag.topN
    httpTimeout: 8s
  # 提示词工程：模板存 MySQL，生效版本缓存到 Redis，发布/激活即失效
  prompt:
    cacheTTL: 60s
    # 启动时补齐内置模板（已存在则跳过，不会覆盖线上改动）
    seedBuiltin: true
    listLimit: 200
  # 记忆系统：短期 Redis（TTL 续期）+ 长期 MySQL（过期时间/去重）+ Milvus 向量召回 + GraphRAG 图谱
  memory:
    shortTTL: 86400s
    recallTopK: 8
    graphEnabled: true
    graphMaxEntities: 8
    graphMaxRelations: 6
    historyLimit: 20
  # 技能管理：技能与市场存 MySQL；启用技能可落盘供运行时读取
  skill:
    # 落盘根目录（为空则只存数据库）
    syncDir: ${SKILL_SYNC_DIR:./data/skills}
    # 默认技能市场（skill_hubs 表为空时自动播种）
    hubBaseURL: ${SKILLHUB_BASE_URL:}
    hubToken: ${SKILLHUB_TOKEN:}
    # 单个技能文件上限（8MB）；技能包里的运行时资源分片常有 1MB+，
    # 上限受 skill_files.content 的 mediumtext（16MB）约束
    maxFileBytes: 8388608
    httpTimeout: 30s
  # AgentFactory：Agent 低代码工厂 + 异步任务 worker
  agentfactory:
    # 任务 worker 并发数
    workerCount: 2
    # Agent 总数配额（防自举失控兜底）
    maxAgents: 200
    # 未指定 max_turns 时的执行图默认轮数
    defaultMaxTurns: 12
    # 优雅停机：停止服务时等待执行中任务跑完的最长时间。
    # 超时则中断（任务保持 running，下次启动自动重跑）；建议小于编排层
    # 的 kill 期限（k8s terminationGracePeriodSeconds 默认 30s）
    shutdownTimeout: 20s

# ── MCP stdio 传输执行策略（环境变量，默认全部拒绝）─────────────────────────
# stdio 会在后端 exec 子进程，等价于代码执行面。默认关闭；启用时必须给白名单：
#   MCP_STDIO_ENABLED=true
#   MCP_STDIO_ALLOWED_COMMANDS=npx,uvx,node      # 允许的命令基名（逗号分隔）
#   MCP_STDIO_ALLOWED_DIRS=/opt/mcp/bin          # command 用绝对路径时必须落在这些目录
#   MCP_STDIO_ALLOW_SHELL=false                  # 是否放行 sh/bash/cmd 等 shell
#   MCP_STDIO_ALLOW_CODE_EXEC=false              # 是否放行 python -c / node -e 内联代码
#   MCP_STDIO_MAX_ARGS=32  MCP_STDIO_MAX_ENV=32
# 危险环境变量（LD_PRELOAD / NODE_OPTIONS / PYTHONPATH / BASH_ENV 等）始终拒绝。
# 写入（Normalize）与执行（Dail）两处都会校验，历史脏数据也拦得住。
