syntax = "proto3";
package kratos.api;

option go_package = "go_agent/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  // 网关层的安全与配额策略（认证 / 限流 / 预算）
  Security security = 3;
}

// Security 安全边界：三项策略互相独立，可分别开关。
// 关闭认证时所有请求按 devUser/devTenant 身份处理，只适合本地开发或纯内网。
message Security {
  Auth auth = 1;
  RateLimit rateLimit = 2;
  Budget budget = 3;
}

// Auth 身份认证：校验 Authorization 头里的 JWT（HS256）或静态令牌。
message Auth {
  bool enabled = 1;
  // HS256 密钥；留空则 JWT 一律拒绝（只能走静态令牌）
  string jwtSecret = 2;
  // 取令牌的请求头名，默认 Authorization（兼容 "Bearer xxx" 与裸 token）
  string header = 3;
  // 从 JWT payload 取用户 / 租户的 claim 名，默认 sub / tenant_id
  string userClaim = 4;
  string tenantClaim = 5;
  // 未启用认证时使用的开发态身份
  string devUser = 6;
  string devTenant = 7;
  // 白名单路径前缀（探活、指标、静态附件），命中即跳过认证
  repeated string publicPaths = 8;
  // 静态令牌 → "user:tenant"（内网脚本 / 巡检用，比签 JWT 省事）
  map<string, string> staticTokens = 9;
  // 用户名密码登录（本地 bcrypt + LDAP/AD）
  Login login = 10;
}

// Login 用户名密码登录配置。
//
// /api/auth/login 在 enabled=true 时成为公开端点（无需令牌即可调用），
// 登录成功签发与网关同密钥的 HS256 JWT——验签逻辑完全复用现有 Verifier，
// 不引入第二种令牌格式。
message Login {
  // 开放用户名密码登录；关闭时端点返回 404，行为与之前完全一致
  bool enabled = 1;
  // 签发令牌有效期（秒），默认 43200 = 12h；登录态不宜过长
  int64 tokenTTLSeconds = 2;
  // LDAP / AD 登录（password 为空或用户 source=ldap 时走这里）
  LDAP ldap = 3;
}

// LDAP LDAP / Active Directory 登录配置。
//
// 验证流程：服务账号 bind → 按 user_filter 搜出用户 DN → 用「用户 DN + 用户密码」
// 再 bind 一次（密码验证永远在 AD 侧完成，平台不落明文）→ 读 memberOf 组 →
// 按 groupRoleMappings 映射角色，首次登录自动建号（source=ldap）。
message LDAP {
  // ldap://host:389 或 ldaps://host:636；ldaps 走 TLS，ldap 可配 startTLS
  string url = 1;
  // 对 ldap:// 连接升级 StartTLS
  bool startTLS = 2;
  // 自签证书的域控需要置 true（仅限内网，公网不要开）
  bool skipTLSVerify = 3;
  // 服务账号 DN + 密码（AD 一般不允许匿名搜索）；留空尝试匿名
  string bindDN = 4;
  string bindPassword = 5;
  // 搜索起点，如 DC=corp,DC=example,DC=com
  string baseDN = 6;
  // 用户过滤器，%s 会替换成登录名；AD 默认按 sAMAccountName 查
  string userFilter = 7;
  string userIDAttr = 8;
  string displayNameAttr = 9;
  string emailAttr = 10;
  // 组归属属性，AD 默认 memberOf；OpenLDAP 常见 memberOf（overlay）或需另查
  string memberOfAttr = 11;
  // AD 组 → 平台角色：组 DN 含 Group 关键字（大小写不敏感）即命中，自上而下取第一个
  repeated GroupRole groupRoleMappings = 12;
  // 未命中任何组时的兜底角色（默认 user）
  string defaultRole = 13;
  // 登录用户归属租户（AD 不感知租户概念，统一落一个租户）
  string defaultTenant = 14;
  // 首次登录自动在 users 表建号；false 时未登记用户直接拒绝
  bool autoProvision = 15;
}

// GroupRole AD 组到平台角色的映射
message GroupRole {
  // 组名或组 DN 的关键片段，如 "Meridians-PlatformAdmins" 或 "CN=Meridians-Admins,"
  string group = 1;
  // authz 规范角色：platform_admin | tenant_admin | developer | operator | auditor | user
  string role = 2;
}

// RateLimit 网关限流：按「租户 + 路由」做令牌桶，超限返回 429 + Retry-After。
message RateLimit {
  bool enabled = 1;
  // 读接口（GET/HEAD）每个租户每路由的 QPS 与桶容量
  double qps = 2;
  int32 burst = 3;
  // 写接口（POST/PUT/PATCH/DELETE）的 QPS 与桶容量；0 = 与读接口一致
  double writeQps = 4;
  int32 writeBurst = 5;
  // 单请求最长执行时间（0 = 用 server.http.timeout）；用于向下游传递 deadline
  google.protobuf.Duration timeout = 6;
}

// Budget 成本闸门：单次 Agent 执行（含派生任务）的 token / 调用次数上限，
// 以及并行波次上限（防止一个宽 DAG 同时烧钱）。
message Budget {
  // 单任务 token 上限（0 = 不限）
  int64 maxTokens = 1;
  // 单任务 LLM 调用次数上限（0 = 不限）
  int32 maxCalls = 2;
  // 并行波次上限（默认 4）
  int32 maxParallel = 3;
  // 计价：输入 / 输出每百万 token 单价（元），用于 /metrics 的成本估算
  double inputPricePerM = 4;
  double outputPricePerM = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // Driver name registered with database/sql, e.g. "mysql".
    string driver = 1;
    // Driver-specific DSN. Keep credentials out of version control.
    string source = 2;
    // Log every generated statement. Development only.
    bool debug = 3;
    // Create or update tables from the ent schema on startup. Leave false in
    // production and apply migrations as a separate, reviewed step.
    bool auto_migrate = 4;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    // 连接超时
    google.protobuf.Duration dial_timeout = 5;
    // 认证与库号（本地无密码时留空即可）
    string password = 6;
    int32 db = 7;
  }
  message Embedding {
    string baseURL = 1;
    string apiKey = 2;
    string model = 3;
    int32 dimension = 4;
    google.protobuf.Duration httpTimeout = 5;
  }
  // LLM 生成模型（OpenAI 兼容接口：DeepSeek / OpenAI / Ollama / SiliconFlow）
  // 这里的配置只作为「兜底默认值」：运行时以 MySQL 中 llm_providers 表为准，
  // 表中为空时自动用本块配置播种一个名为 default 的数据源。
  message LLM {
    string baseURL = 1;
    string apiKey = 2;
    string model = 3;
    // 默认温度；图谱抽取固定用 0
    double temperature = 4;
    google.protobuf.Duration httpTimeout = 5;
    // 多数据源配置的内存缓存时长：MySQL 变更后最多这么久对本实例生效
    // （变更接口会立即刷新本实例，这里只兜住多实例场景）
    google.protobuf.Duration reloadTTL = 6;
  }
  // Milvus 向量库（3.x，开启 BM25 混合检索）
  message Milvus {
    string uri = 1;
    string token = 2;
    string collection = 3;
    // 连接超时：Milvus 未启动时快速失败，避免进程静默挂住
    google.protobuf.Duration timeout = 4;
    // 等待集合加载（LoadCollection）的上限
    google.protobuf.Duration loadTimeout = 5;
  }
  // RAG 检索与图谱参数
  message Rag {
    int32 topK = 1;
    int32 topN = 2;
    int32 maxChunk = 3;
    int32 overlap = 4;
    // 问答结果缓存 TTL（Redis）
    google.protobuf.Duration cacheTTL = 5;
    int32 graphTopK = 6;
    int32 graphHops = 7;
    int32 graphMaxEdges = 8;
    int32 graphMaxEntities = 9;
    int32 graphMaxRelations = 10;
    // 单次 embedding 请求的文本条数
    int32 embedBatch = 11;
  }

  // 提示词工程：模板版本化与在线生效
  message Prompt {
    // 生效版本在 Redis 中的缓存时长；0 表示不缓存（每次回源 MySQL）
    google.protobuf.Duration cacheTTL = 1;
    // 启动时补齐内置模板（已存在则跳过）
    bool seedBuiltin = 2;
    // 列表接口单次返回上限
    int32 listLimit = 3;
  }

  // 记忆系统：短期（Redis 会话）+ 长期（MySQL 权威存储 + Milvus 向量召回 + GraphRAG 图谱）
  message Memory {
    // 短期会话记忆在 Redis 的存活时长（每次写入自动续期）
    google.protobuf.Duration shortTTL = 1;
    // 向量召回条数
    int32 recallTopK = 2;
    // 记忆入库时是否抽取实体关系写入知识图谱
    bool graphEnabled = 3;
    // 单条记忆最多抽取实体/关系数
    int32 graphMaxEntities = 4;
    int32 graphMaxRelations = 5;
    // 生成回答时携带的短期历史条数
    int32 historyLimit = 6;
  }

  // 技能管理：技能清单/文件存 MySQL，可按需落盘供运行时读取；
  // 技能市场（skillhub）数据源存 MySQL，这里只提供默认兜底。
  message Skill {
    // 技能落盘根目录；为空表示只存 MySQL 不下发磁盘
    string syncDir = 1;
    // 默认技能市场地址（skill_hubs 表为空时回退到这里）
    string hubBaseURL = 2;
    string hubToken = 3;
    // 单个技能文件内容上限（字节）
    int64 maxFileBytes = 4;
    // 技能市场请求超时
    google.protobuf.Duration httpTimeout = 5;
  }

  // AgentFactory：Agent 低代码工厂 + 异步任务 worker
  message Agentfactory {
    // 任务 worker 并发数
    int32 workerCount = 1;
    // Agent 总数配额（防自举失控的兜底）
    int32 maxAgents = 2;
    // 未指定 max_turns 时的执行图默认轮数
    int32 defaultMaxTurns = 3;
    // 优雅停机：停止服务时等待执行中任务跑完的最长时间（超时则中断，
    // 任务保持 running，下次启动自动重跑）
    google.protobuf.Duration shutdownTimeout = 4;
  }

  // 重排序（RAG 召回后精排；可选能力，未启用或调用失败时按检索原序返回）
  message Rerank {
    bool enabled = 1;
    // cohere：POST {baseURL}/rerank（Jina / SiliconFlow / Cohere 兼容协议）
    // dashscope：POST {baseURL}/api/v1/services/rerank/rerank（百炼原生，model 如 gte-rerank）
    string provider = 2;
    string baseURL = 3;
    string apiKey = 4;
    string model = 5;
    // 重排后保留条数（0 = 沿用 rag.topN）
    int32 topN = 6;
    google.protobuf.Duration httpTimeout = 7;
  }

  Database database = 1;
  Redis redis = 2;
  Embedding embedding = 3;
  LLM llm = 4;
  Milvus milvus = 5;
  Rag rag = 6;
  Prompt prompt = 7;
  Memory memory = 8;
  Skill skill = 9;
  Agentfactory agentfactory = 10;
  Rerank rerank = 11;
}
